<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Calendar Thirteen — симметричный календарь из тринадцати месяцев по двадцать восемь дней."
    />
    <title>Calendar Thirteen</title>
    <link rel="stylesheet" href="styles.css" />

  <body>
    <main class="page-shell">
      <section class="legend" aria-label="Условные обозначения">

      </section>

      <div id="calendar" class="calendar" aria-live="polite"></div>
    </main>

    <script src="app.js"></script>
